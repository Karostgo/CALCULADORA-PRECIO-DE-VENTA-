<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Precio de Venta 💰</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <!-- SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- jsPDF y AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      min-height: 100vh;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    .result-box {
      background-color: #fff3cd;
      padding: 1rem;
      border-radius: 0.5rem;
    }
    .whatsapp-btn {
      background-color: #25D366;
      color: white;
    }
    table th, table td {
      vertical-align: middle;
    }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-4 animate__animated animate__fadeInDown">
        <h2 class="text-center mb-4">💸 Calculadora de Precio de Venta</h2>
        <form id="priceForm">
          <div class="mb-3">
            <label class="form-label">Nombre del Producto 🏷️</label>
            <input type="text" class="form-control" id="concept" placeholder="Ej: Taza personalizada" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Costo Base 🛒</label>
            <input type="number" step="0.01" class="form-control" id="cost" placeholder="Ej: 100" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Porcentaje de Ganancia (%) 📈</label>
            <input type="number" step="0.01" class="form-control" id="profit" placeholder="Ej: 30" required>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-success">Calcular 💡</button>
          </div>
        </form>

        <div id="result" class="mt-4 d-none animate__animated animate__fadeInUp">
          <div class="result-box">
            <p>📝 <strong>Producto:</strong> <span id="conceptResult"></span></p>
            <p>💰 <strong>Precio Sugerido:</strong> <span id="finalPrice" class="fw-bold text-primary"></span></p>
            <p>📊 <strong>Ganancia:</strong> <span id="profitAmount" class="fw-bold text-success"></span></p>
            <a id="shareBtn" target="_blank" class="btn whatsapp-btn mt-2">📤 Compartir por WhatsApp</a>
          </div>
        </div>
      </div>

      <div class="mt-5">
        <h4 class="mb-3">📋 Historial de Productos Calculados</h4>
        <div class="table-responsive">
          <table class="table table-striped table-bordered" id="productTable">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Concepto</th>
                <th>Costo Base</th>
                <th>Ganancia (%)</th>
                <th>Precio Sugerido</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="d-flex gap-3 mt-3">
          <button class="btn btn-danger" onclick="exportPDF()">📄 Exportar PDF</button>
          <button class="btn btn-primary" onclick="exportExcel()">📊 Exportar Excel</button>
          <button class="btn btn-secondary" onclick="clearTable()">🧹 Limpiar Tabla</button>
        </div>
      </div>

      <p class="text-center mt-4 text-muted">Hecho para emprendedores 🚀</p>
    </div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    let count = 0;
    const tableBody = document.querySelector("#productTable tbody");

    // Cargar historial desde localStorage al iniciar
    let savedData = JSON.parse(localStorage.getItem("productHistory")) || [];
    savedData.forEach(item => {
      count++;
      const row = `<tr>
        <td>${count}</td>
        <td>${item.concept}</td>
        <td>$${item.cost}</td>
        <td>${item.profitPercent}%</td>
        <td>$${item.finalPrice}</td>
      </tr>`;
      tableBody.insertAdjacentHTML("beforeend", row);
    });

    // Cargar último cálculo desde localStorage
    const lastCalculation = JSON.parse(localStorage.getItem("lastCalculation"));
    if (lastCalculation) {
      document.getElementById("conceptResult").textContent = lastCalculation.concept;
      document.getElementById("finalPrice").textContent = "$" + lastCalculation.finalPrice;
      document.getElementById("profitAmount").textContent = "$" + lastCalculation.profitAmount;
      document.getElementById("result").classList.remove("d-none");
    }

    document.getElementById("priceForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const concept = document.getElementById("concept").value.trim();
      const cost = parseFloat(document.getElementById("cost").value);
      const profitPercent = parseFloat(document.getElementById("profit").value);

      if (!concept || isNaN(cost) || isNaN(profitPercent) || cost <= 0) {
        alert("Por favor completa todos los campos correctamente.");
        return;
      }

      const profitAmount = (cost * profitPercent) / 100;
      const finalPrice = cost + profitAmount;

      // Mostrar el último cálculo
      document.getElementById("conceptResult").textContent = concept;
      document.getElementById("finalPrice").textContent = "$" + finalPrice.toFixed(2);
      document.getElementById("profitAmount").textContent = "$" + profitAmount.toFixed(2);
      document.getElementById("result").classList.remove("d-none");

      // Guardar en localStorage el último cálculo
      const lastCalculation = {
        concept,
        finalPrice: finalPrice.toFixed(2),
        profitAmount: profitAmount.toFixed(2)
      };
      localStorage.setItem("lastCalculation", JSON.stringify(lastCalculation));

      // Guardar en el historial de la tabla
      const rowData = {
        concept,
        cost: cost.toFixed(2),
        profitPercent: profitPercent.toFixed(2),
        finalPrice: finalPrice.toFixed(2)
      };
      savedData.push(rowData);
      localStorage.setItem("productHistory", JSON.stringify(savedData));

      count++;
      const row = `<tr>
        <td>${count}</td>
        <td>${concept}</td>
        <td>$${cost.toFixed(2)}</td>
        <td>${profitPercent.toFixed(2)}%</td>
        <td>$${finalPrice.toFixed(2)}</td>
      </tr>`;
      tableBody.insertAdjacentHTML("beforeend", row);

      this.reset();
    });

    // Función para exportar a PDF
    window.exportPDF = function() {
      const doc = new jspdf.jsPDF();
      doc.text("Historial de Precios Calculados", 14, 16);
      doc.autoTable({ html: "#productTable", startY: 20 });
      doc.save("precios_calculados.pdf");
    }

    // Función para exportar a Excel
    window.exportExcel = function() {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.table_to_sheet(document.getElementById("productTable"));
      XLSX.utils.book_append_sheet(wb, ws, "Precios");
      XLSX.writeFile(wb, "precios_calculados.xlsx");
    }

    // Función para limpiar la tabla
    window.clearTable = function() {
      if (confirm("¿Estás seguro que deseas limpiar toda la tabla? Esta acción no se puede deshacer.")) {
        tableBody.innerHTML = "";
        count = 0;
        localStorage.removeItem("productHistory");
        localStorage.removeItem("lastCalculation");
      }
    }
  });
</script>
</body>
</html>
